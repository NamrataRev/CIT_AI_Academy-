<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
{% include head.html %}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <button class="menu-toggle" aria-label="Toggle navigation" onclick="document.body.classList.toggle('nav-open')">
    <span></span><span></span><span></span>
  </button>
  <a class="brand" href="{{ '/' | relative_url }}">
    <svg class="brand-logo" viewBox="0 0 240 74" role="img" aria-label="Revature Home">
      <g class="logo-rays" stroke="#e0632b" stroke-width="2.4" stroke-linecap="round">
        <line x1="136.2" y1="38.7" x2="148.5" y2="34.7"/>
        <line x1="135.0" y1="35.9" x2="146.4" y2="29.8"/>
        <line x1="133.3" y1="33.4" x2="143.5" y2="25.3"/>
        <line x1="131.2" y1="31.2" x2="139.7" y2="21.4"/>
        <line x1="128.7" y1="29.4" x2="135.4" y2="18.2"/>
        <line x1="126.0" y1="28.1" x2="130.5" y2="15.9"/>
        <line x1="123.0" y1="27.3" x2="125.4" y2="14.5"/>
        <line x1="120.0" y1="27.0" x2="120.0" y2="14.0"/>
        <line x1="117.0" y1="27.3" x2="114.6" y2="14.5"/>
        <line x1="114.0" y1="28.1" x2="109.5" y2="15.9"/>
        <line x1="111.3" y1="29.4" x2="104.6" y2="18.2"/>
        <line x1="108.8" y1="31.2" x2="100.3" y2="21.4"/>
        <line x1="106.7" y1="33.4" x2="96.5" y2="25.3"/>
        <line x1="105.0" y1="35.9" x2="93.6" y2="29.8"/>
        <line x1="103.8" y1="38.7" x2="91.5" y2="34.7"/>
      </g>
      <text class="logo-word" x="120" y="64" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3">REVATURE</text>
    </svg>
  </a>
  <span class="site-title">Foundations of Responsible AI Engineering</span>
  <button class="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
  </button>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    {% include sidebar.html %}
  </aside>
  <div class="nav-scrim" onclick="document.body.classList.remove('nav-open')"></div>
  <main class="content" id="main">
    {{ content }}
  </main>
</div>
<script src="{{ '/assets/js/app.js' | relative_url }}"></script>
</body>
</html>
